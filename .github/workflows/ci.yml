name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.4'

jobs:
  ci-quality-gate:
    name: Build & Test Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Enable Corepack
        shell: bash
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @vexel/api prisma:generate

      - name: SDK freshness (openapi.yaml -> generated SDK)
        run: pnpm check:sdk-freshness

      - name: Lint workspace (includes SDK-only/no-fetch/no-axios/no-Prisma frontend rules, UI color-lint)
        run: pnpm lint

      - name: UI color-lint (no hard-coded colors in Admin/Operator)
        run: pnpm ui:color-lint

      - name: Admin/Operator vs OpenAPI parity
        run: pnpm check:admin-openapi-parity

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Build workspace
        run: pnpm build

      - name: Run API Unit Tests
        run: pnpm --filter @vexel/api test

      - name: Run SDK Unit Tests
        run: pnpm --filter @vexel/sdk test
